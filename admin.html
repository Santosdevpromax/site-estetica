<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | Alcione Pacheco</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary-green: #4a5c44;
            --bg-dark: #121a11;
            --card-bg: #ffffff;
            --text-dark: #1e291c;
            --danger: #dc2626;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-dark); padding: 2rem; min-height: 100vh; }

        .admin-container { max-width: 900px; margin: 0 auto; }
        
        .header-admin {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ffffff;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.15);
        }
        .header-admin h1 { font-size: 1.8rem; }
        
        .btn-view-site {
            color: #ffffff;
            text-decoration: none;
            background: rgba(255,255,255,0.15);
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: background 0.3s;
        }
        .btn-view-site:hover { background: rgba(255,255,255,0.25); }

        .card-admin {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .card-admin h2 { color: var(--primary-green); margin-bottom: 1.5rem; border-bottom: 2px solid #e2e8f0; padding-bottom: 0.5rem; }

        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 0.4rem; font-size: 0.9rem; }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .btn-save {
            background: var(--primary-green);
            color: #ffffff;
            padding: 0.8rem 1.8rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .btn-save:hover { opacity: 0.9; }

        .fb-admin-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }
        .fb-admin-info { flex: 1; }
        .btn-delete {
            background: var(--danger);
            color: #fff;
            border: none;
            padding: 0.5rem 0.9rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
        }
        .btn-delete:hover { opacity: 0.85; }
    </style>
</head>
<body>

    <div class="admin-container">
        <div class="header-admin">
            <h1><i class="fa-solid fa-sliders"></i> Painel de Controle</h1>
            <a href="index.html" class="btn-view-site" target="_blank"><i class="fa-solid fa-arrow-up-right-from-square"></i> Ver Site</a>
        </div>

        <!-- Gerenciamento do Conteúdo do Site -->
        <div class="card-admin">
            <h2><i class="fa-solid fa-pen-to-square"></i> Editar Conteúdo Principal</h2>
            <form id="adminForm">
                <div class="form-group">
                    <label>Nome da Marca / Título da Logo</label>
                    <input type="text" id="brandNameInput" value="Alcione Pacheco">
                </div>
                <div class="form-group">
                    <label>Título Principal (Hero)</label>
                    <input type="text" id="heroTitleInput" value="Cuidado minimalista, resultados extraordinários.">
                </div>
                <div class="form-group">
                    <label>Subtítulo Principal</label>
                    <textarea id="heroSubtitleInput" rows="2">Protocolos estéticos avançados focados em rejuvenescimento natural e saúde da pele.</textarea>
                </div>
                <div class="form-group">
                    <label>Telefone / WhatsApp (ex: 35998167478)</label>
                    <input type="text" id="phoneInput" value="(35) 998167478">
                </div>
                <div class="form-group">
                    <label>Endereço / Horário de Atendimento</label>
                    <input type="text" id="addressInput" value="Atendimento Presencial com Hora Marcada">
                </div>

                <button type="submit" class="btn-save"><i class="fa-solid fa-floppy-disk"></i> Salvar Alterações</button>
            </form>
        </div>

        <!-- Gerenciamento de Feedbacks do Firebase -->
        <div class="card-admin">
            <h2><i class="fa-solid fa-comments"></i> Feedbacks Recebidos (Firebase)</h2>
            <div id="adminFeedbacksList">
                <p style="color: #666;">Carregando feedbacks...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { db, ref, onValue } from "./firebase.js";
        import { remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Salvar configurações gerais
        document.getElementById('adminForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const content = {
                brandName: document.getElementById('brandNameInput').value,
                heroTitle: document.getElementById('heroTitleInput').value,
                heroSubtitle: document.getElementById('heroSubtitleInput').value,
                phone: document.getElementById('phoneInput').value,
                address: document.getElementById('addressInput').value
            };
            localStorage.setItem('siteContent', JSON.stringify(content));
            alert('Configurações salvas com sucesso!');
        });

        // Carregar feedbacks para gerenciar/deletar do Firebase
        const adminList = document.getElementById('adminFeedbacksList');
        const feedbacksRef = ref(db, 'feedbacks');

        onValue(feedbacksRef, (snapshot) => {
            const data = snapshot.val();
            adminList.innerHTML = '';

            if (!data) {
                adminList.innerHTML = '<p style="color: #666;">Nenhum feedback registrado.</p>';
                return;
            }

            Object.keys(data).forEach(key => {
                const item = data[key];
                const div = document.createElement('div');
                div.className = 'fb-admin-card';
                div.innerHTML = `
                    <div class="fb-admin-info">
                        <strong>${item.name || 'Anônimo'}</strong> <small style="color:#777;">(${item.date || ''})</small>
                        <p style="font-size:0.9rem; color:#444; margin-top:4px;">"${item.text}"</p>
                    </div>
                    <button class="btn-delete" data-id="${key}"><i class="fa-solid fa-trash"></i> Excluir</button>
                `;
                adminList.appendChild(div);
            });

            // Evento para excluir feedback
            document.querySelectorAll('.btn-delete').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const id = e.currentTarget.getAttribute('data-id');
                    if (confirm('Deseja realmente apagar este feedback?')) {
                        await remove(ref(db, `feedbacks/${id}`));
                        alert('Feedback removido!');
                    }
                });
            });
        });
    </script>
</body>
</html>
