<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo | Alcione Pacheco</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary-green: #4a5c44;
            --bg-dark: #121a11;
            --card-bg: #ffffff;
            --text-dark: #1e291c;
            --danger: #dc2626;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-dark); padding: 2rem; min-height: 100vh; }

        .admin-container { max-width: 1000px; margin: 0 auto; }
        
        .header-admin {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ffffff;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.15);
            flex-wrap: wrap;
            gap: 1rem;
        }
        .header-admin h1 { font-size: 1.8rem; }
        
        .btn-view-site {
            color: #ffffff;
            text-decoration: none;
            background: rgba(255,255,255,0.15);
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: background 0.3s;
        }
        .btn-view-site:hover { background: rgba(255,255,255,0.25); }

        .card-admin {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .card-admin h2 {
            color: var(--primary-green);
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 0.4rem; font-size: 0.9rem; }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .btn-action {
            background: var(--primary-green);
            color: #ffffff;
            padding: 0.8rem 1.8rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .btn-action:hover { opacity: 0.9; }

        .item-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            position: relative;
        }

        .btn-delete {
            background: var(--danger);
            color: #fff;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: opacity 0.2s;
        }
        .btn-delete:hover { opacity: 0.85; }

        .fb-admin-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        @media (max-width: 600px) {
            body { padding: 1rem; }
            .fb-admin-card { flex-direction: column; align-items: flex-start; }
            .fb-admin-card .btn-delete { align-self: flex-end; }
        }
    </style>
</head>
<body>

    <div class="admin-container">
        <div class="header-admin">
            <h1><i class="fa-solid fa-sliders"></i> Painel de Controle Completo</h1>
            <a href="index.html" class="btn-view-site" target="_blank"><i class="fa-solid fa-arrow-up-right-from-square"></i> Ver Site</a>
        </div>

        <!-- Gerenciamento do Conteúdo Principal -->
        <div class="card-admin">
            <h2><i class="fa-solid fa-pen-to-square"></i> Informações Gerais e Marca</h2>
            <form id="generalForm">
                <div class="form-group">
                    <label>URL da Logo (Opcional)</label>
                    <input type="text" id="logoUrlInput" placeholder="https://exemplo.com/logo.png">
                </div>
                <div class="form-group">
                    <label>Nome da Marca / Título da Logo</label>
                    <input type="text" id="brandNameInput" required>
                </div>
                <div class="form-group">
                    <label>Título Principal (Hero)</label>
                    <input type="text" id="heroTitleInput" required>
                </div>
                <div class="form-group">
                    <label>Subtítulo Principal</label>
                    <textarea id="heroSubtitleInput" rows="2" required></textarea>
                </div>
                <div class="form-group">
                    <label>Texto do Botão Principal</label>
                    <input type="text" id="heroBtnTextInput" required>
                </div>
                <div class="form-group">
                    <label>Telefone / WhatsApp (ex: 35998167478)</label>
                    <input type="text" id="phoneInput" required>
                </div>
                <div class="form-group">
                    <label>Endereço / Horário de Atendimento</label>
                    <input type="text" id="addressInput" required>
                </div>

                <button type="submit" class="btn-action" id="saveBtn"><i class="fa-solid fa-floppy-disk"></i> Salvar Informações no Firebase</button>
            </form>
        </div>

        <!-- Gerenciamento de Diferenciais -->
        <div class="card-admin">
            <h2>
                <span><i class="fa-solid fa-star"></i> Diferenciais</span>
                <button type="button" class="btn-action" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;" id="addDiffBtn"><i class="fa-solid fa-plus"></i> Adicionar</button>
            </h2>
            <div id="diffsList"></div>
        </div>

        <!-- Gerenciamento de Tratamentos -->
        <div class="card-admin">
            <h2>
                <span><i class="fa-solid fa-spa"></i> Tratamentos (Postagens)</span>
                <button type="button" class="btn-action" style="padding: 0.4rem 0.8rem; font-size: 0.85rem;" id="addTreatmentBtn"><i class="fa-solid fa-plus"></i> Adicionar Tratamento</button>
            </h2>
            <div id="treatmentsList"></div>
        </div>

        <!-- Gerenciamento de Feedbacks do Firebase -->
        <div class="card-admin">
            <h2><i class="fa-solid fa-comments"></i> Feedbacks dos Clientes (Firebase)</h2>
            <div id="adminFeedbacksList">
                <p style="color: #666;">Carregando feedbacks em tempo real...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { db, ref, set, onValue } from "./firebase.js";
        import { remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        let currentData = {
            logoUrl: "",
            brandName: "",
            heroTitle: "",
            heroSubtitle: "",
            heroBtnText: "",
            phone: "",
            address: "",
            differentials: [],
            treatments: []
        };

        // Carrega os dados direto do Firebase em Tempo Real
        function listenToFirebaseData() {
            const siteRef = ref(db, 'siteContent');
            onValue(siteRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    currentData = {
                        ...data,
                        differentials: data.differentials ? (Array.isArray(data.differentials) ? data.differentials : Object.values(data.differentials)) : [],
                        treatments: data.treatments ? (Array.isArray(data.treatments) ? data.treatments : Object.values(data.treatments)) : []
                    };
                    populateGeneralForm();
                    renderDiffs();
                    renderTreatments();
                }
            });
        }

        function populateGeneralForm() {
            document.getElementById('logoUrlInput').value = currentData.logoUrl || '';
            document.getElementById('brandNameInput').value = currentData.brandName || '';
            document.getElementById('heroTitleInput').value = currentData.heroTitle || '';
            document.getElementById('heroSubtitleInput').value = currentData.heroSubtitle || '';
            document.getElementById('heroBtnTextInput').value = currentData.heroBtnText || '';
            document.getElementById('phoneInput').value = currentData.phone || '';
            document.getElementById('addressInput').value = currentData.address || '';
        }

        async function saveToFirebase(showAlert = false) {
            try {
                const siteRef = ref(db, 'siteContent');
                await set(siteRef, currentData);
                if (showAlert) alert('Alterações salvas com sucesso no banco de dados!');
            } catch (err) {
                console.error("Erro ao salvar:", err);
                alert("Erro ao salvar alterações.");
            }
        }

        document.getElementById('generalForm').addEventListener('submit', (e) => {
            e.preventDefault();
            currentData.logoUrl = document.getElementById('logoUrlInput').value;
            currentData.brandName = document.getElementById('brandNameInput').value;
            currentData.heroTitle = document.getElementById('heroTitleInput').value;
            currentData.heroSubtitle = document.getElementById('heroSubtitleInput').value;
            currentData.heroBtnText = document.getElementById('heroBtnTextInput').value;
            currentData.phone = document.getElementById('phoneInput').value;
            currentData.address = document.getElementById('addressInput').value;
            saveToFirebase(true);
        });

        function renderDiffs() {
            const container = document.getElementById('diffsList');
            container.innerHTML = '';
            currentData.differentials.forEach((diff, index) => {
                const box = document.createElement('div');
                box.className = 'item-box';
                box.innerHTML = `
                    <div style="display:flex; justify-content:space-between; margin-bottom: 0.5rem; align-items:center;">
                        <strong>Diferencial #${index + 1}</strong>
                        <button type="button" class="btn-delete" onclick="removeDiff(${index})"><i class="fa-solid fa-trash"></i> Excluir</button>
                    </div>
                    <div class="form-group">
                        <label>Ícone (FontAwesome)</label>
                        <input type="text" value="${diff.icon || ''}" onchange="updateDiff(${index}, 'icon', this.value)">
                    </div>
                    <div class="form-group">
                        <label>Título</label>
                        <input type="text" value="${diff.title || ''}" onchange="updateDiff(${index}, 'title', this.value)">
                    </div>
                    <div class="form-group">
                        <label>Descrição</label>
                        <input type="text" value="${diff.desc || ''}" onchange="updateDiff(${index}, 'desc', this.value)">
                    </div>
                `;
                container.appendChild(box);
            });
        }

        window.updateDiff = (index, field, value) => {
            currentData.differentials[index][field] = value;
            saveToFirebase(false);
        };

        window.removeDiff = (index) => {
            currentData.differentials.splice(index, 1);
            saveToFirebase(false);
        };

        document.getElementById('addDiffBtn').addEventListener('click', () => {
            currentData.differentials.push({ icon: 'fa-solid fa-star', title: 'Novo Diferencial', desc: 'Descrição' });
            saveToFirebase(false);
        });

        function renderTreatments() {
            const container = document.getElementById('treatmentsList');
            container.innerHTML = '';
            currentData.treatments.forEach((t, index) => {
                const box = document.createElement('div');
                box.className = 'item-box';
                box.innerHTML = `
                    <div style="display:flex; justify-content:space-between; margin-bottom: 0.5rem; align-items:center;">
                        <strong>Tratamento #${index + 1}</strong>
                        <button type="button" class="btn-delete" onclick="removeTreatment(${index})"><i class="fa-solid fa-trash"></i> Excluir</button>
                    </div>
                    <div class="form-group">
                        <label>Nome do Tratamento</label>
                        <input type="text" value="${t.name || ''}" onchange="updateTreatment(${index}, 'name', this.value)">
                    </div>
                    <div class="form-group">
                        <label>URL da Imagem</label>
                        <input type="text" value="${t.imageUrl || ''}" onchange="updateTreatment(${index}, 'imageUrl', this.value)">
                    </div>
                    <div class="form-group">
                        <label>Descrição</label>
                        <textarea onchange="updateTreatment(${index}, 'desc', this.value)">${t.desc || ''}</textarea>
                    </div>
                    <div class="form-group">
                        <label>Tópicos (um por linha)</label>
                        <textarea onchange="updateTreatment(${index}, 'topics', this.value)">${t.topics || ''}</textarea>
                    </div>
                    <div class="form-group">
                        <label>Duração/Tempo</label>
                        <input type="text" value="${t.time || ''}" onchange="updateTreatment(${index}, 'time', this.value)">
                    </div>
                `;
                container.appendChild(box);
            });
        }

        window.updateTreatment = (index, field, value) => {
            currentData.treatments[index][field] = value;
            saveToFirebase(false);
        };

        window.removeTreatment = (index) => {
            currentData.treatments.splice(index, 1);
            saveToFirebase(false);
        };

        document.getElementById('addTreatmentBtn').addEventListener('click', () => {
            currentData.treatments.push({ name: 'Novo Tratamento', desc: '', imageUrl: '', topics: '', time: '' });
            saveToFirebase(false);
        });

        // Moderação de Feedbacks
        function listenToAdminFeedbacks() {
            const container = document.getElementById('adminFeedbacksList');
            const fbRef = ref(db, 'feedbacks');
            onValue(fbRef, (snapshot) => {
                const data = snapshot.val();
                container.innerHTML = '';
                if (!data) {
                    container.innerHTML = '<p style="color:#666;">Nenhum feedback recebido ainda.</p>';
                    return;
                }
                Object.entries(data).forEach(([key, fb]) => {
                    const card = document.createElement('div');
                    card.className = 'fb-admin-card';
                    card.innerHTML = `
                        <div>
                            <strong>${fb.name}</strong> <small>(${fb.date || ''})</small>
                            <p style="margin-top:0.3rem;">${fb.text}</p>
                        </div>
                        <button class="btn-delete" onclick="deleteFeedback('${key}')"><i class="fa-solid fa-trash"></i> Excluir</button>
                    `;
                    container.appendChild(card);
                });
            });
        }

        window.deleteFeedback = async (key) => {
            if (confirm("Deseja realmente excluir este feedback?")) {
                await remove(ref(db, `feedbacks/${key}`));
            }
        };

        listenToFirebaseData();
        listenToAdminFeedbacks();
    </script>
</body>
</html>
