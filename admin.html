<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="X-Content-Type-Options" content="nosniff">
<meta name="referrer" content="no-referrer">
<link rel="icon" type="image/png" href="https://i.ibb.co/CK8tMBD8/Code-Generated-Image.png">
<title>Painel Administrativo | Estética Alcione Pacheco</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
body { background-color: #121a11; color: #1e291c; padding: 2rem; min-height: 100vh; }
#loginScreen {
  max-width: 400px; margin: 12vh auto 0 auto; background-color: #ffffff;
  border: 2px solid #4a5c44; border-radius: 16px; padding: 2.5rem 2rem;
  box-shadow: 0 15px 35px rgba(0,0,0,0.6); text-align: center;
}
.login-icon {
  width: 60px; height: 60px; border-radius: 50%; background-color: #eef2ed;
  color: #4a5c44; display: flex; align-items: center; justify-content: center;
  font-size: 1.5rem; margin: 0 auto 1rem auto;
}
#loginScreen h2 { color: #4a5c44; margin-bottom: 0.5rem; font-size: 1.4rem; }
#loginScreen p { color: #57655a; font-size: 0.9rem; margin-bottom: 1.5rem; }
.login-input {
  width: 100%; padding: 0.85rem; border: 2px solid #cbd5e1; border-radius: 10px;
  font-size: 1.2rem; text-align: center; letter-spacing: 4px;
  background-color: #f8fafc; color: #1e291c; margin-bottom: 1rem; outline: none;
}
.login-input:focus { border-color: #4a5c44; background-color: #ffffff; }
.login-input:disabled { background-color: #e2e8f0; cursor: not-allowed; }
.login-error { color: #dc2626; font-size: 0.85rem; font-weight: 600; margin-bottom: 1rem; display: none; }
.admin-container { max-width: 1000px; margin: 0 auto; display: none; }
.header-admin {
  display: flex; justify-content: space-between; align-items: center; color: #ffffff;
  margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid rgba(255,255,255,0.15);
  flex-wrap: wrap; gap: 1rem;
}
.header-admin h1 { font-size: 1.6rem; }
.header-actions { display: flex; gap: 0.8rem; align-items: center; }
.btn-view-site, .btn-logout {
  color: #ffffff; text-decoration: none; background: rgba(255,255,255,0.15);
  padding: 0.6rem 1.2rem; border-radius: 8px; font-size: 0.9rem; border: none; cursor: pointer;
}
.card-admin {
  background: #ffffff; border-radius: 12px; padding: 2rem;
  margin-bottom: 2rem; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
}
.card-admin h2 {
  color: #4a5c44; margin-bottom: 1.5rem; border-bottom: 2px solid #e2e8f0;
  padding-bottom: 0.5rem; display: flex; justify-content: space-between;
  align-items: center; flex-wrap: wrap; gap: 0.5rem;
}
.form-group { margin-bottom: 1.2rem; }
.form-group label { display: block; font-weight: 600; margin-bottom: 0.4rem; font-size: 0.9rem; }
.form-group input, .form-group textarea {
  width: 100%; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.95rem;
}
.btn-action {
  background-color: #4a5c44; color: #ffffff; padding: 0.85rem 1.6rem;
  border: none; border-radius: 8px; font-weight: 600; font-size: 0.95rem; cursor: pointer;
}
.btn-action:disabled { opacity: 0.5; cursor: not-allowed; }
.item-box {
  background: #f8fafc; border: 1px solid #e2e8f0;
  border-radius: 8px; padding: 1rem; margin-bottom: 1rem;
}
.ba-preview-row { display: flex; gap: 1rem; margin-top: 0.5rem; flex-wrap: wrap; }
.ba-preview-box {
  flex: 1; min-width: 140px; background: #ffffff; border: 1px solid #cbd5e1;
  border-radius: 8px; padding: 0.5rem; text-align: center;
}
.ba-preview-box img { width: 100%; height: 120px; object-fit: cover; border-radius: 6px; margin-top: 0.3rem; }
.btn-delete {
  background: #dc2626; color: #fff; border: none; padding: 0.4rem 0.8rem;
  border-radius: 6px; cursor: pointer; font-size: 0.85rem;
}
.fb-admin-card {
  background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; padding: 1rem;
  margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem;
}
@media (max-width: 600px) {
  body { padding: 1rem; }
  .fb-admin-card { flex-direction: column; align-items: flex-start; }
  .fb-admin-card .btn-delete { align-self: flex-end; }
}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-icon"><i class="fa-solid fa-shield-halved"></i></div>
  <h2>Acesso Restrito</h2>
  <p>Por segurança, digite a senha administrativa sempre que acessar o painel.</p>
  <form id="loginForm" autocomplete="off">
    <input type="password" id="adminPasswordInput" class="login-input" placeholder="Senha" autocomplete="new-password" required autofocus>
    <div class="login-error" id="loginError"></div>
    <button type="submit" id="loginSubmitBtn" class="btn-action" style="width:100%;">Desbloquear Painel</button>
  </form>
</div>

<div class="admin-container" id="adminPanel">
  <div class="header-admin">
    <h1><i class="fa-solid fa-sliders"></i> Painel de Controle</h1>
    <div class="header-actions">
      <a href="index.html" class="btn-view-site" target="_blank" rel="noopener noreferrer">Ver Site</a>
      <button type="button" class="btn-logout" id="logoutBtn"><i class="fa-solid fa-lock"></i> Bloquear</button>
    </div>
  </div>

  <div class="card-admin">
    <h2>Informações Gerais e Marca</h2>
    <form id="generalForm">
      <div class="form-group">
        <label>URL da Logo (Opcional)</label>
        <input type="text" id="logoUrlInput" placeholder="https://exemplo.com/logo.png">
      </div>
      <div class="form-group">
        <label>Nome da Marca / Título da Logo</label>
        <input type="text" id="brandNameInput" required>
      </div>
      <div class="form-group">
        <label>Título Principal (Hero)</label>
        <input type="text" id="heroTitleInput" required>
      </div>
      <div class="form-group">
        <label>Subtítulo Principal</label>
        <textarea id="heroSubtitleInput" rows="2" required></textarea>
      </div>
      <div class="form-group">
        <label>Texto do Botão Principal</label>
        <input type="text" id="heroBtnTextInput" required>
      </div>
      <div class="form-group">
        <label>Telefone / WhatsApp (ex: 35998167478)</label>
        <input type="text" id="phoneInput" required>
      </div>
      <div class="form-group">
        <label>Endereço / Horário de Atendimento</label>
        <input type="text" id="addressInput" required>
      </div>
      <button type="submit" class="btn-action">Salvar Informações no Firebase</button>
    </form>
  </div>

  <div class="card-admin">
    <h2>
      <span>Diferenciais</span>
      <button type="button" class="btn-action" style="padding:0.4rem 0.8rem;font-size:0.85rem;" id="addDiffBtn">+ Adicionar</button>
    </h2>
    <div id="diffsList"></div>
  </div>

  <div class="card-admin">
    <h2>
      <span>Tratamentos (Postagens)</span>
      <button type="button" class="btn-action" style="padding:0.4rem 0.8rem;font-size:0.85rem;" id="addTreatmentBtn">+ Adicionar</button>
    </h2>
    <div id="treatmentsList"></div>
  </div>

  <div class="card-admin">
    <h2>
      <span>Resultados: Antes & Depois</span>
      <button type="button" class="btn-action" style="padding:0.4rem 0.8rem;font-size:0.85rem;" id="addBeforeAfterBtn">+ Adicionar</button>
    </h2>
    <div id="beforeAfterList"></div>
  </div>

  <div class="card-admin">
    <h2>Feedbacks dos Clientes</h2>
    <div id="adminFeedbacksList"><p style="color:#666;">Carregando...</p></div>
  </div>
</div>

<script>
// Limpa qualquer rastro antigo de sessão salva
try { sessionStorage.removeItem('adminAuth'); localStorage.removeItem('adminAuth'); } catch (e) {}

const EXPECTED_HASH = "24ef6a52fb66b98922fcfd033510960ab4eb0c78115b77271e473151f6d8b1c9";
let isAuthenticated = false;
let failedAttempts = 0;
let lockUntil = 0;
let inactivityTimer = null;

const loginScreen = document.getElementById('loginScreen');
const adminPanel = document.getElementById('adminPanel');
const loginForm = document.getElementById('loginForm');
const passwordInput = document.getElementById('adminPasswordInput');
const loginSubmitBtn = document.getElementById('loginSubmitBtn');
const loginError = document.getElementById('loginError');

async function sha256(text) {
  const encoder = new TextEncoder();
  const data = encoder.encode(text);
  const hashBuffer = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(hashBuffer)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function bloquearPainel(msg) {
  isAuthenticated = false;
  adminPanel.style.display = 'none';
  loginScreen.style.display = 'block';
  passwordInput.value = '';
  if (inactivityTimer) clearTimeout(inactivityTimer);
  if (msg) {
    loginError.textContent = msg;
    loginError.style.display = 'block';
  }
}

function resetInactivityTimer() {
  if (!isAuthenticated) return;
  if (inactivityTimer) clearTimeout(inactivityTimer);
  // Tranca automaticamente após 10 minutos sem interação
  inactivityTimer = setTimeout(() => {
    bloquearPainel('Sessão expirada por inatividade. Digite a senha novamente.');
  }, 10 * 60 * 1000);
}

['click', 'keydown', 'mousemove', 'touchstart'].forEach(evt => {
  document.addEventListener(evt, resetInactivityTimer, { passive: true });
});

function startLockoutCountdown() {
  passwordInput.disabled = true;
  loginSubmitBtn.disabled = true;
  const interval = setInterval(() => {
    const remaining = Math.ceil((lockUntil - Date.now()) / 1000);
    if (remaining <= 0) {
      clearInterval(interval);
      passwordInput.disabled = false;
      loginSubmitBtn.disabled = false;
      failedAttempts = 0;
      loginError.style.display = 'none';
      passwordInput.focus();
    } else {
      loginError.textContent = 'Muitas tentativas incorretas. Aguarde ' + remaining + 's.';
      loginError.style.display = 'block';
    }
  }, 500);
}

loginForm.addEventListener('submit', async function(e) {
  e.preventDefault();
  if (Date.now() < lockUntil) return;

  const typedHash = await sha256(passwordInput.value.trim());
  if (typedHash === EXPECTED_HASH) {
    isAuthenticated = true;
    failedAttempts = 0;
    passwordInput.value = '';
    loginError.style.display = 'none';
    loginScreen.style.display = 'none';
    adminPanel.style.display = 'block';
    resetInactivityTimer();
    if (window.initAdminData) window.initAdminData();
  } else {
    failedAttempts++;
    passwordInput.value = '';
    if (failedAttempts >= 3) {
      lockUntil = Date.now() + 60000;
      startLockoutCountdown();
    } else {
      loginError.textContent = 'Senha incorreta (' + failedAttempts + '/3 tentativas).';
      loginError.style.display = 'block';
      passwordInput.focus();
    }
  }
});

document.getElementById('logoutBtn').addEventListener('click', function() {
  bloquearPainel('');
});
</script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBN8vm7CzOl3rZsLvk3ddifTmuafjZta6g",
  authDomain: "site-aphc.firebaseapp.com",
  projectId: "site-aphc",
  storageBucket: "site-aphc.firebasestorage.app",
  messagingSenderId: "1012964206543",
  appId: "1:1012964206543:web:51d14173114d9b370894ba",
  measurementId: "G-K5EM79WKGQ",
  databaseURL: "https://site-aphc-default-rtdb.firebaseio.com"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let listenersStarted = false;
let currentData = {
  logoUrl: "", brandName: "", heroTitle: "", heroSubtitle: "",
  heroBtnText: "", phone: "", address: "",
  differentials: [], treatments: [], beforeAfter: []
};

function escapeHtml(str) {
  return String(str || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Só carrega dados do banco após a senha ser validada
window.initAdminData = function() {
  if (listenersStarted) return;
  listenersStarted = true;
  listenToFirebaseData();
  listenToAdminFeedbacks();
};

function listenToFirebaseData() {
  const siteRef = ref(db, 'siteContent');
  onValue(siteRef, (snapshot) => {
    const data = snapshot.val();
    if (!data) return;
    currentData = {
      ...data,
      differentials: data.differentials ? (Array.isArray(data.differentials) ? data.differentials : Object.values(data.differentials)) : [],
      treatments: data.treatments ? (Array.isArray(data.treatments) ? data.treatments : Object.values(data.treatments)) : [],
      beforeAfter: data.beforeAfter ? (Array.isArray(data.beforeAfter) ? data.beforeAfter : Object.values(data.beforeAfter)) : []
    };
    populateGeneralForm();
    renderDiffs();
    renderTreatments();
    renderBeforeAfter();
  });
}

function populateGeneralForm() {
  document.getElementById('logoUrlInput').value = currentData.logoUrl || '';
  document.getElementById('brandNameInput').value = currentData.brandName || '';
  document.getElementById('heroTitleInput').value = currentData.heroTitle || '';
  document.getElementById('heroSubtitleInput').value = currentData.heroSubtitle || '';
  document.getElementById('heroBtnTextInput').value = currentData.heroBtnText || '';
  document.getElementById('phoneInput').value = currentData.phone || '';
  document.getElementById('addressInput').value = currentData.address || '';
}

async function saveToFirebase(showAlert) {
  try {
    await set(ref(db, 'siteContent'), currentData);
    if (showAlert) alert('Alterações salvas com sucesso!');
  } catch (err) {
    console.error(err);
    alert('Erro ao salvar alterações. Verifique as permissões do banco.');
  }
}

document.getElementById('generalForm').addEventListener('submit', (e) => {
  e.preventDefault();
  currentData.logoUrl = document.getElementById('logoUrlInput').value;
  currentData.brandName = document.getElementById('brandNameInput').value;
  currentData.heroTitle = document.getElementById('heroTitleInput').value;
  currentData.heroSubtitle = document.getElementById('heroSubtitleInput').value;
  currentData.heroBtnText = document.getElementById('heroBtnTextInput').value;
  currentData.phone = document.getElementById('phoneInput').value;
  currentData.address = document.getElementById('addressInput').value;
  saveToFirebase(true);
});

function renderDiffs() {
  const container = document.getElementById('diffsList');
  container.innerHTML = '';
  currentData.differentials.forEach((diff, index) => {
    const box = document.createElement('div');
    box.className = 'item-box';
    box.innerHTML = [
      '<div style="display:flex;justify-content:space-between;margin-bottom:0.5rem;align-items:center;">',
      '<strong>Diferencial #' + (index + 1) + '</strong>',
      '<button type="button" class="btn-delete" onclick="removeDiff(' + index + ')">Excluir</button>',
      '</div>',
      '<div class="form-group"><label>Ícone (FontAwesome)</label>',
      '<input type="text" value="' + escapeHtml(diff.icon) + '" onchange="updateDiff(' + index + ',\'icon\',this.value)"></div>',
      '<div class="form-group"><label>Título</label>',
      '<input type="text" value="' + escapeHtml(diff.title) + '" onchange="updateDiff(' + index + ',\'title\',this.value)"></div>',
      '<div class="form-group"><label>Descrição</label>',
      '<input type="text" value="' + escapeHtml(diff.desc) + '" onchange="updateDiff(' + index + ',\'desc\',this.value)"></div>'
    ].join('');
    container.appendChild(box);
  });
}

window.updateDiff = (index, field, value) => { currentData.differentials[index][field] = value; saveToFirebase(false); };
window.removeDiff = (index) => { currentData.differentials.splice(index, 1); saveToFirebase(false); };
document.getElementById('addDiffBtn').addEventListener('click', () => {
  currentData.differentials.push({ icon: 'fa-solid fa-star', title: 'Novo Diferencial', desc: 'Descrição' });
  saveToFirebase(false);
});

function renderTreatments() {
  const container = document.getElementById('treatmentsList');
  container.innerHTML = '';
  currentData.treatments.forEach((t, index) => {
    const box = document.createElement('div');
    box.className = 'item-box';
    box.innerHTML = [
      '<div style="display:flex;justify-content:space-between;margin-bottom:0.5rem;align-items:center;">',
      '<strong>Tratamento #' + (index + 1) + '</strong>',
      '<button type="button" class="btn-delete" onclick="removeTreatment(' + index + ')">Excluir</button>',
      '</div>',
      '<div class="form-group"><label>Nome do Tratamento</label>',
      '<input type="text" value="' + escapeHtml(t.name) + '" onchange="updateTreatment(' + index + ',\'name\',this.value)"></div>',
      '<div class="form-group"><label>URL da Imagem</label>',
      '<input type="text" value="' + escapeHtml(t.imageUrl) + '" onchange="updateTreatment(' + index + ',\'imageUrl\',this.value)"></div>',
      '<div class="form-group"><label>Descrição</label>',
      '<textarea onchange="updateTreatment(' + index + ',\'desc\',this.value)">' + escapeHtml(t.desc) + '</textarea></div>',
      '<div class="form-group"><label>Tópicos (um por linha)</label>',
      '<textarea onchange="updateTreatment(' + index + ',\'topics\',this.value)">' + escapeHtml(t.topics) + '</textarea></div>',
      '<div class="form-group"><label>Duração/Tempo</label>',
      '<input type="text" value="' + escapeHtml(t.time) + '" onchange="updateTreatment(' + index + ',\'time\',this.value)"></div>'
    ].join('');
    container.appendChild(box);
  });
}

window.updateTreatment = (index, field, value) => { currentData.treatments[index][field] = value; saveToFirebase(false); };
window.removeTreatment = (index) => { currentData.treatments.splice(index, 1); saveToFirebase(false); };
document.getElementById('addTreatmentBtn').addEventListener('click', () => {
  currentData.treatments.push({ name: 'Novo Tratamento', desc: '', imageUrl: '', topics: '', time: '' });
  saveToFirebase(false);
});

function renderBeforeAfter() {
  const container = document.getElementById('beforeAfterList');
  container.innerHTML = '';
  currentData.beforeAfter.forEach((ba, index) => {
    const box = document.createElement('div');
    box.className = 'item-box';
    let previews = '';
    if (ba.beforeUrl || ba.afterUrl) {
      previews = '<div class="ba-preview-row">' +
        (ba.beforeUrl ? '<div class="ba-preview-box"><small><strong>Antes</strong></small><img src="' + escapeHtml(ba.beforeUrl) + '"></div>' : '') +
        (ba.afterUrl ? '<div class="ba-preview-box"><small><strong>Depois</strong></small><img src="' + escapeHtml(ba.afterUrl) + '"></div>' : '') +
        '</div>';
    }
    box.innerHTML = [
      '<div style="display:flex;justify-content:space-between;margin-bottom:0.5rem;align-items:center;">',
      '<strong>Resultado #' + (index + 1) + '</strong>',
      '<button type="button" class="btn-delete" onclick="removeBeforeAfter(' + index + ')">Excluir</button>',
      '</div>',
      '<div class="form-group"><label>Título do Procedimento</label>',
      '<input type="text" value="' + escapeHtml(ba.title) + '" onchange="updateBeforeAfter(' + index + ',\'title\',this.value)"></div>',
      '<div class="form-group"><label>URL da Foto ANTES</label>',
      '<input type="text" value="' + escapeHtml(ba.beforeUrl) + '" onchange="updateBeforeAfter(' + index + ',\'beforeUrl\',this.value)"></div>',
      '<div class="form-group"><label>URL da Foto DEPOIS</label>',
      '<input type="text" value="' + escapeHtml(ba.afterUrl) + '" onchange="updateBeforeAfter(' + index + ',\'afterUrl\',this.value)"></div>',
      '<div class="form-group"><label>Descrição (Opcional)</label>',
      '<textarea rows="2" onchange="updateBeforeAfter(' + index + ',\'desc\',this.value)">' + escapeHtml(ba.desc) + '</textarea></div>',
      previews
    ].join('');
    container.appendChild(box);
  });
}

window.updateBeforeAfter = (index, field, value) => { currentData.beforeAfter[index][field] = value; saveToFirebase(false); };
window.removeBeforeAfter = (index) => { currentData.beforeAfter.splice(index, 1); saveToFirebase(false); };
document.getElementById('addBeforeAfterBtn').addEventListener('click', () => {
  currentData.beforeAfter.push({ title: 'Novo Resultado', beforeUrl: '', afterUrl: '', desc: '' });
  saveToFirebase(false);
});

function listenToAdminFeedbacks() {
  const container = document.getElementById('adminFeedbacksList');
  onValue(ref(db, 'feedbacks'), (snapshot) => {
    const data = snapshot.val();
    container.innerHTML = '';
    if (!data) {
      container.innerHTML = '<p style="color:#666;">Nenhum feedback recebido ainda.</p>';
      return;
    }
    Object.entries(data).forEach(([key, fb]) => {
      const card = document.createElement('div');
      card.className = 'fb-admin-card';
      card.innerHTML = [
        '<div><strong>' + escapeHtml(fb.name) + '</strong> <small>(' + escapeHtml(fb.date) + ')</small>',
        '<p style="margin-top:0.3rem;">' + escapeHtml(fb.text) + '</p></div>',
        '<button class="btn-delete" onclick="deleteFeedback(\'' + escapeHtml(key) + '\')">Excluir</button>'
      ].join('');
      container.appendChild(card);
    });
  });
}

window.deleteFeedback = async (key) => {
  if (confirm('Deseja realmente excluir este feedback?')) {
    await remove(ref(db, 'feedbacks/' + key));
  }
};
</script>
</body>
</html>
