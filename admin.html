<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://i.ibb.co/CK8tMBD8/Code-Generated-Image.png">
    <title>Painel Administrativo | Alcione Pacheco</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary-green: #4a5c44;
            --bg-dark: #121a11;
            --card-bg: #ffffff;
            --text-dark: #1e291c;
            --danger: #dc2626;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Montserrat', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-dark); padding: 2rem; min-height: 100vh; }

        /* TELA DE LOGIN */
        .login-overlay {
            position: fixed;
            inset: 0;
            background-color: var(--bg-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            z-index: 9999;
        }

        .login-box {
            background: var(--card-bg);
            width: 100%;
            max-width: 400px;
            border-radius: 16px;
            padding: 2.5rem 2rem;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.45);
            text-align: center;
        }

        .login-icon {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: rgba(74, 92, 68, 0.12);
            color: var(--primary-green);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.6rem;
            margin: 0 auto 1.2rem auto;
        }

        .login-box h2 {
            color: var(--primary-green);
            margin-bottom: 0.4rem;
            font-size: 1.4rem;
        }

        .login-box p {
            color: #64748b;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }

        .login-input {
            width: 100%;
            padding: 0.85rem 1rem;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 1.1rem;
            text-align: center;
            letter-spacing: 3px;
            margin-bottom: 1rem;
            outline: none;
        }

        .login-input:focus {
            border-color: var(--primary-green);
        }

        .login-error {
            color: var(--danger);
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: none;
        }

        /* PAINEL PRINCIPAL */
        .admin-container { max-width: 1000px; margin: 0 auto; display: none; }
        
        .header-admin {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #ffffff;
            margin-bottom: 2rem;
            padding-bottom: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.15);
            flex-wrap: wrap;
            gap: 1rem;
        }
        .header-admin h1 { font-size: 1.8rem; }

        .header-actions {
            display: flex;
            gap: 0.8rem;
            align-items: center;
        }
        
        .btn-view-site, .btn-logout {
            color: #ffffff;
            text-decoration: none;
            background: rgba(255,255,255,0.15);
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-size: 0.9rem;
            border: none;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-view-site:hover, .btn-logout:hover { background: rgba(255,255,255,0.25); }

        .card-admin {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 2rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }
        .card-admin h2 {
            color: var(--primary-green);
            margin-bottom: 1.5rem;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 0.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .form-group { margin-bottom: 1.2rem; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 0.4rem; font-size: 0.9rem; }
        .form-group input, .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 0.95rem;
        }

        .btn-action {
            background: var(--primary-green);
            color: #ffffff;
            padding: 0.8rem 1.8rem;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .btn-action:hover { opacity: 0.9; }

        .item-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            position: relative;
        }

        .ba-preview-row {
            display: flex;
            gap: 1rem;
            margin-top: 0.5rem;
            flex-wrap: wrap;
        }

        .ba-preview-box {
            flex: 1;
            min-width: 140px;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            padding: 0.5rem;
            text-align: center;
        }

        .ba-preview-box img {
            width: 100%;
            height: 120px;
            object-fit: cover;
            border-radius: 6px;
            margin-top: 0.3rem;
        }

        .btn-delete {
            background: var(--danger);
            color: #fff;
            border: none;
            padding: 0.4rem 0.8rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: opacity 0.2s;
        }
        .btn-delete:hover { opacity: 0.85; }

        .fb-admin-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 1rem;
            margin-bottom: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 1rem;
        }

        @media (max-width: 600px) {
